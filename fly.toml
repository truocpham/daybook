# Change `app` to a unique name: the site will be https://<app>.fly.dev
app = "daybook-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DAYBOOK_DATA = "/data"
  DAYBOOK_PUBLIC_URL = "https://daybook-CHANGE-ME.fly.dev"
  # LITESTREAM_REPLICA_URL = "s3://your-bucket/daybook"   # plus the secrets in README.md

[mounts]
  source = "daybook_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
