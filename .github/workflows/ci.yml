name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # the server embeds web/dist at compile time; an empty folder is enough for unit tests
      - run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - run: cargo test --manifest-path server/Cargo.toml

  web:
    name: Web type check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    name: Browser tests (Docker + Playwright)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t daybook:dev .
      - run: sh e2e/run.sh
